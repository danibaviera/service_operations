<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #eceae5; }
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #1f1f1f; }
      .subtitle { font: 500 16px 'Segoe UI', sans-serif; fill: #3a3a3a; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #1b1b1b; }
      .tiny { font: 500 12px 'Segoe UI', sans-serif; fill: #364152; }
      .box { fill: #f3efd0; stroke: #656565; stroke-width: 1.5; }
      .box-blue { fill: #1f5bd5; stroke: #1f5bd5; }
      .text-blue { fill: white; font: 600 18px 'Segoe UI', sans-serif; }
      .box-gold { fill: #d9a03a; stroke: #b87919; stroke-width: 1.2; }
      .text-gold { fill: #1f1f1f; font: 600 16px 'Segoe UI', sans-serif; }
      .connector { stroke: #2f2f2f; stroke-width: 2.5; fill: none; }
      .dashed { stroke-dasharray: 8 8; }
      .thin { stroke-width: 1.4; }
      .ellipse-box { fill: #f3f3f3; stroke: #404040; stroke-width: 1.5; }
      .pill { fill: #e8e8e8; stroke: #4d4d4d; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text x="40" y="70" class="title">Mapa de conexões — repositórios Aurora Grid</text>
  <text x="40" y="104" class="subtitle">DAG (grafo acíclico dirigido) das relações produtor → consumidor entre os 9 repositórios com</text>
  <text x="1110" y="104" class="subtitle" font-weight="700" fill="#1d5bd8">-grid</text>
  <text x="1185" y="104" class="subtitle"> no nome.</text>

  <rect x="260" y="160" width="620" height="140" rx="0" class="box"/>
  <text x="520" y="190" text-anchor="middle" class="label">Sem conexão com os demais</text>

  <rect x="300" y="220" width="180" height="52" rx="4" class="box-blue"/>
  <text x="390" y="252" text-anchor="middle" class="text-blue">aurora-meteo-raw</text>

  <rect x="500" y="220" width="170" height="52" rx="4" class="box-blue"/>
  <text x="585" y="252" text-anchor="middle" class="text-blue">aurora-modelos-meteo</text>

  <rect x="690" y="220" width="160" height="52" rx="4" class="box-blue"/>
  <text x="770" y="252" text-anchor="middle" class="text-blue">aurora-historico-meteo</text>

  <ellipse cx="1210" cy="280" rx="140" ry="42" class="ellipse-box"/>
  <text x="1210" y="266" text-anchor="middle" class="label">Fornecedor externo</text>
  <text x="1210" y="292" text-anchor="middle" class="label">dados climáticos</text>

  <line x1="1180" y1="280" x2="1100" y2="280" class="connector dashed thin"/>
  <text x="1046" y="286" class="tiny">POST</text>

  <rect x="1040" y="330" width="430" height="250" rx="0" class="box"/>
  <text x="1255" y="360" text-anchor="middle" class="label">Cadeia de recebimento do payload</text>

  <rect x="1090" y="390" width="210" height="52" rx="4" class="box-blue"/>
  <text x="1195" y="422" text-anchor="middle" class="text-blue">aurora-webhook-pipeline</text>

  <text x="1240" y="470" text-anchor="middle" class="tiny">Gateway + orquestração de fluxo</text>

  <rect x="1102" y="510" width="170" height="52" rx="4" class="box-blue"/>
  <text x="1187" y="542" text-anchor="middle" class="text-blue">aurora-webhook-ingest</text>
  <text x="1187" y="565" text-anchor="middle" class="tiny">recebe dado externo</text>

  <rect x="1305" y="510" width="140" height="52" rx="4" class="box-blue"/>
  <text x="1375" y="542" text-anchor="middle" class="text-blue">aurora-alerta</text>
  <text x="1375" y="565" text-anchor="middle" class="tiny">dispara alerta</text>

  <polyline points="1150,440 1150,510" class="connector"/>
  <line x1="1310" y1="540" x2="1305" y2="540" class="connector dashed"/>
  <line x1="1195" y1="562" x2="1060" y2="562" class="connector dashed"/>

  <rect x="70" y="430" width="635" height="220" rx="0" class="box"/>
  <text x="390" y="460" text-anchor="middle" class="label">Produtores espelho (mesmo prefixo de armazenamento)</text>

  <rect x="115" y="520" width="120" height="52" rx="4" class="box-blue"/>
  <text x="175" y="552" text-anchor="middle" class="text-blue">aurora-modelo-a</text>

  <rect x="275" y="520" width="110" height="52" rx="4" class="box-blue"/>
  <text x="330" y="552" text-anchor="middle" class="text-blue">aurora-modelo-b</text>

  <rect x="430" y="520" width="120" height="52" rx="4" class="box-blue"/>
  <text x="490" y="552" text-anchor="middle" class="text-blue">aurora-modelo-c</text>

  <path d="M 210 570 L 210 640 L 270 640" class="connector"/>
  <path d="M 330 570 L 330 640 L 330 640" class="connector"/>
  <path d="M 490 570 L 490 640 L 430 640" class="connector"/>

  <ellipse cx="425" cy="680" rx="170" ry="34" class="box-gold"/>
  <text x="425" y="688" text-anchor="middle" class="text-gold">Storage aurora-produtos</text>
  <text x="425" y="706" text-anchor="middle" class="text-gold">operaçao/webhook_grid</text>

  <ellipse cx="760" cy="680" rx="165" ry="34" class="box-gold"/>
  <text x="760" y="688" text-anchor="middle" class="text-gold">Storage aurora-modelo-c</text>

  <ellipse cx="990" cy="680" rx="165" ry="34" class="box-gold"/>
  <text x="990" y="688" text-anchor="middle" class="text-gold">Storage aurora-modelo-b</text>

  <ellipse cx="1215" cy="680" rx="170" ry="34" class="box-gold"/>
  <text x="1215" y="688" text-anchor="middle" class="text-gold">Storage aurora-modelo-a</text>

  <line x1="560" y1="570" x2="600" y2="610" class="connector"/>
  <line x1="650" y1="610" x2="760" y2="650" class="connector"/>
  <line x1="760" y1="650" x2="990" y2="650" class="connector"/>
  <line x1="990" y1="650" x2="1215" y2="650" class="connector"/>

  <line x1="800" y1="560" x2="1130" y2="560" class="connector dashed"/>
  <line x1="1230" y1="560" x2="1375" y2="560" class="connector dashed"/>
  <line x1="1375" y1="560" x2="1375" y2="610" class="connector dashed"/>
  <line x1="1375" y1="610" x2="1375" y2="680" class="connector dashed"/>

  <line x1="1030" y1="610" x2="980" y2="680" class="connector dashed"/>
  <line x1="1035" y1="610" x2="1215" y2="680" class="connector dashed"/>
  <line x1="900" y1="610" x2="760" y2="680" class="connector dashed"/>

  <line x1="530" y1="650" x2="620" y2="650" class="connector"/>
  <line x1="620" y1="650" x2="760" y2="650" class="connector"/>

  <path d="M 470 590 C 560 610, 650 610, 740 620" class="connector"/>
  <path d="M 180 590 C 200 610, 250 610, 300 610" class="connector"/>

  <text x="1130" y="766" font-size="12" fill="#666">Visual fictício para portfólio — representando dependências e fluxo de dados sem expor arquitetura real.</text>
</svg>
